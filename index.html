<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To-Do List — Regan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-Do List</h1>
      <p class="subtitle">Simple task manager — stored in localStorage</p>
    </header>

    <section class="input-section">
      <label for="task-input" class="visually-hidden">Add a new task</label>
      <input id="task-input" type="text" placeholder="Add a new task and press Enter" autocomplete="off" />
      <button id="add-btn" class="btn" type="button">Add</button>
    </section>

    <section class="controls">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div class="extras">
        <span id="remaining-count">0 items left</span>
        <button id="clear-completed" class="text-btn">Clear completed</button>
      </div>
    </section>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <footer class="credits">
      Built with Regan Patel — Press Enter to add
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
